[project]
name = "autobid-backend"
version = "0.1.0"
description = "AutoBid - AI-Powered Campaign Control Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.50.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "faker>=26.0.0",
    "python-dateutil>=2.9.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "rank-bm25>=0.2.2",
    "redis>=5.0.0",
    "langsmith>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
